        let currentSceneIndex = 0;
        let currentStory = null;

        function loadStory() {
            const novelType = localStorage.getItem('currentNovel') || 'mystery';
            currentStory = stories[novelType] || stories.mystery;
            currentSceneIndex = 0;
            
            document.getElementById('gameBackground').style.background = currentStory.background;
            showScene(currentSceneIndex);
        }

        function showScene(index) {
            if (index >= currentStory.scenes.length) {
                index = currentStory.scenes.length - 1;
            }
            
            const scene = currentStory.scenes[index];
            
            document.getElementById('speakerName').textContent = scene.speaker;
            document.getElementById('dialogueText').textContent = scene.text;
            
            // Update character
            const charElement = document.getElementById('character1');
            if (scene.character !== undefined && currentStory.characters[scene.character]) {
                charElement.textContent = currentStory.characters[scene.character];
            }
            
            // Handle choices
            const choiceButtons = document.getElementById('choiceButtons');
            const continueBtn = document.getElementById('continueBtn');
            
            if (scene.choices && scene.choices.length > 0) {
                choiceButtons.style.display = 'flex';
                continueBtn.style.display = 'none';
                
                choiceButtons.innerHTML = '';
                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => makeChoice(choice);
                    choiceButtons.appendChild(btn);
                });
            } else {
                choiceButtons.style.display = 'none';
                continueBtn.style.display = 'inline-block';
            }
        }

        function makeChoice(choice) {
            if (choice.action === 'exit') {
                window.location.href = 'index.html';
                return;
            }
            
            currentSceneIndex = choice.next;
            showScene(currentSceneIndex);
        }

        function nextDialogue() {
            currentSceneIndex++;
            if (currentSceneIndex >= currentStory.scenes.length) {
                currentSceneIndex = 0;
            }
            showScene(currentSceneIndex);
        }

        // Initialize game
        window.addEventListener('load', loadStory);
